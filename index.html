<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b17">
<title>CBG's Lair — Chaos Gremlins</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#100b17;--panel:#1c1224;--panel-hover:#281632;--purple:#d997ff;--purple-bright:#edb4ff;--muted:#cbb9d4;--line:#603d72;--gold:#d7b45e;--glow:0 0 10px #d997ff55,0 0 24px #b64ce944}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#100b17;color:#f5eafa;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% -5%,#e5dce8 0%,#b9aebb 14%,#33243a 27%,transparent 44%),#100b17;opacity:.95}
.topbar{height:72px;margin:14px auto 0;width:min(1120px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;padding:0 22px;border:1px solid #6a4b79;border-radius:28px 28px 0 0;background:#c6bdc9b8;box-shadow:0 0 18px #b45fd51a;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:10px;font-size:1.15rem;color:#f8efff}.moon{color:#fff;font-size:1.5rem;text-shadow:0 0 10px #d997ff}.account{position:relative}.account-button{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#19131d;font-size:1.35rem;cursor:pointer;transition:transform .2s,box-shadow .2s}.account-button:hover,.account-button:focus-visible{box-shadow:0 0 0 3px #e5a8ff,0 0 20px #d997ff;transform:scale(1.05);outline:none}.account-menu{display:none;position:absolute;right:0;top:52px;min-width:190px;padding:8px;background:#1b1123;border:1px solid var(--line);border-radius:12px;box-shadow:var(--glow)}.account-menu.open{display:block}.account-menu button{width:100%;text-align:left;background:transparent;color:#f5eafa;border:0;border-radius:8px;padding:11px;cursor:pointer;font:inherit}.account-menu button:hover{background:#35203f}
main{width:min(1120px,calc(100% - 32px));margin:0 auto}.hero{text-align:center;padding:12px 12px 30px;background:linear-gradient(180deg,#c6bdc9b8 0%,#55465a 40%,#100b17 100%);border-left:1px solid #6a4b79;border-right:1px solid #6a4b79}.cbg{font-family:'Cormorant Garamond',Georgia,serif;font-size:.85rem;color:#f5eafa;letter-spacing:.12em;margin:0 0 18px}h1{font-family:'UnifrakturMaguntia',Georgia,serif;font-weight:400;font-size:clamp(2.65rem,7vw,5.2rem);line-height:1.06;margin:0;color:#f2d8ff;text-shadow:0 0 5px #fff,0 0 12px #d997ff,0 0 24px #a94bd3;letter-spacing:.01em}.tagline{margin:14px 0 0;font-size:clamp(1rem,2.6vw,1.35rem);color:#ead8f2}.divider{height:1px;width:100%;margin:22px auto 0;background:linear-gradient(90deg,transparent,#a16eb3,transparent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:24px 28px 28px;border:1px solid #603d72;border-top:0;border-radius:0 0 28px 28px;background:#100b17}.category{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:18px;min-height:275px;padding:22px 20px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:inherit;text-align:left;cursor:pointer;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease,background .28s ease;isolation:isolate;overflow:hidden}.category:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;box-shadow:inset 0 0 24px #c35df51a,0 0 22px #d997ff65;transition:opacity .25s;z-index:-1}.category:hover,.category:focus-visible{transform:translateY(-4px) scale(1.008);border-color:var(--purple-bright);background:linear-gradient(145deg,#24152e,#1b1224 70%);box-shadow:0 0 0 1px #d997ff20,0 0 22px #c65be94a,0 0 36px #a94bd31a;animation:cardPulse 1.6s ease-in-out infinite}.category:hover:before,.category:focus-visible:before{opacity:1}.category:focus-visible{outline:2px solid var(--purple-bright);outline-offset:3px}.icon{width:34px;height:34px;color:var(--purple);filter:drop-shadow(0 0 5px #d997ff50)}.icon svg{width:100%;height:100%;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.category h2{font-family:'UnifrakturMaguntia',Georgia,serif;font-weight:400;font-size:clamp(1.65rem,3.4vw,2.35rem);line-height:1.1;margin:0;color:#e9c5ff;text-shadow:0 0 5px #d997ff48}.category p{font-size:clamp(.95rem,1.8vw,1.08rem);line-height:1.55;margin:0;color:var(--muted);flex:1}.enter{margin-top:auto;padding:0;border:0;background:transparent;color:var(--purple);font:500 1rem Inter,system-ui,sans-serif;cursor:pointer;transition:color .2s,text-shadow .2s,transform .2s}.enter:hover,.enter:focus-visible{color:#fff;text-shadow:0 0 8px #d997ff,0 0 18px #d997ff;transform:translateX(3px);outline:none}.footer{text-align:center;padding:20px 0 30px;color:#a990b5;font-size:.8rem;letter-spacing:.12em}.footer span{color:var(--gold);padding:0 8px}
.detail{display:none;min-height:360px;padding:24px;margin:0 0 28px;border:1px solid var(--line);border-radius:0 0 24px 24px;background:#100b17}.detail.active{display:block;animation:fadeIn .25s ease}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.detail h2{font:400 clamp(2rem,5vw,3rem) 'UnifrakturMaguntia',Georgia,serif;color:#e9c5ff;text-shadow:0 0 10px #d997ff;margin:0}.back{border:1px solid #8d5ba2;background:#21132b;color:#f6e7ff;border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer;transition:box-shadow .2s}.back:hover{box-shadow:var(--glow)}.detail-description{color:var(--muted);line-height:1.5}.channel-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}.channel{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #493052;border-radius:12px;background:#1c1224;color:#eadcf3}.channel-icon{color:var(--purple);font-size:1.15rem}.type{margin-left:auto;color:#d6a2f0;font:600 .68rem Inter,system-ui,sans-serif;letter-spacing:.08em}.channel.vc .type{color:var(--gold)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:999px;background:#281333;border:1px solid #9e5fba;color:#f5e8ff;box-shadow:var(--glow);display:none;max-width:calc(100% - 30px);text-align:center}.toast.show{display:block;animation:fadeIn .2s ease}
@keyframes cardPulse{0%,100%{box-shadow:0 0 12px #d997ff24, inset 0 0 12px #d997ff08}50%{box-shadow:0 0 25px #d997ff6b, inset 0 0 22px #d997ff16}}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.category{min-height:245px}}@media(max-width:560px){.topbar{width:calc(100% - 24px);height:58px;margin-top:12px;padding:0 16px;border-radius:26px 26px 0 0}.brand{font-size:1.05rem}main{width:calc(100% - 24px)}.hero{padding:10px 12px 26px}.cbg{margin-bottom:16px}h1{font-size:clamp(2.35rem,8.8vw,3.25rem)}.tagline{font-size:1rem;margin-top:12px}.grid{gap:12px;padding:20px 14px 18px;border-radius:0 0 26px 26px}.category{min-height:0;padding:18px 14px;gap:15px;border-radius:20px}.category h2{font-size:clamp(1.35rem,5.1vw,1.75rem)}.category p{font-size:.91rem;line-height:1.55}.icon{width:31px;height:31px}.enter{font-size:.96rem}.channel-list{grid-template-columns:1fr}.detail{padding:18px}.detail-head{align-items:flex-start}.back{padding:9px 11px;font-size:.86rem}}@media(max-width:360px){.grid{gap:9px;padding:15px 10px}.category{padding:14px 11px}.category h2{font-size:1.28rem}.category p{font-size:.85rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="moon">☾</span><span>CBG’s Lair</span></div><div class="account"><button class="account-button" id="accountButton" aria-label="Open account menu" aria-expanded="false">♙</button><div class="account-menu" id="accountMenu"><button data-account="My account">My account</button><button data-account="Account settings">Account settings</button><button data-account="Sign in / create account">Sign in / create account</button></div></div></header>
<main>
<section id="homeView">
  <div class="hero"><p class="cbg">( CBG )</p><h1>Chaos Gremlins</h1><p class="tagline">One unhinged community.</p><div class="divider"></div></div>
  <div class="grid" id="categoryGrid">
    <button class="category" data-category="Community"><span class="icon"><svg viewBox="0 0 40 40"><circle cx="20" cy="12" r="6"/><path d="M8 32v-3c0-6 5-10 12-10s12 4 12 10v3M5 18a5 5 0 0 0 0 10M35 18a5 5 0 0 1 0 10M2 34v-2c0-3 2-5 5-5M38 34v-2c0-3-2-5-5-5"/></svg></span><h2>Community</h2><p>Everything you need to get started, stay informed, and connect with the community.</p><span class="enter">Enter →</span></button>
    <button class="category" data-category="Gremlin Corner"><span class="icon"><svg viewBox="0 0 40 40"><path d="M5 7h22a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5h-8l-8 6v-6H5a5 5 0 0 1-5-5V12a5 5 0 0 1 5-5Z"/><path d="M13 2h21a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5M10 17h.1M18 17h.1M26 17h.1"/></svg></span><h2>Gremlin Corner</h2><p>Hang out, meet other gremlins, share your interests, and let it all out.</p><span class="enter">Enter →</span></button>
    <button class="category" data-category="Gaming"><span class="icon"><svg viewBox="0 0 40 40"><path d="M10 10h20a7 7 0 0 1 7 6l2 12a4 4 0 0 1-6 4l-7-6H14l-7 6a4 4 0 0 1-6-4l2-12a7 7 0 0 1 7-6Z"/><path d="M12 16v8M8 20h8M27 18h.1M32 23h.1"/></svg></span><h2>Gaming</h2><p>Find gaming buddies, share clips, and team up for your favorite games.</p><span class="enter">Enter →</span></button>
    <button class="category" data-category="Media"><span class="icon"><svg viewBox="0 0 40 40"><path d="M15 31V7l20-4v24M15 13l20-4"/><ellipse cx="8" cy="32" rx="7" ry="4"/><ellipse cx="28" cy="28" rx="7" ry="4"/></svg></span><h2>Media</h2><p>Discover music, trade recommendations, talk sports, and share memes.</p><span class="enter">Enter →</span></button>
    <button class="category" data-category="TikTok"><span class="icon"><svg viewBox="0 0 40 40"><path d="M23 4v22a9 9 0 1 1-8-9M23 4c1 7 5 10 11 11"/></svg></span><h2>TikTok</h2><p>Keep up with livestreams, share content and clips, and plan what’s next.</p><span class="enter">Enter →</span></button>
    <button class="category" data-category="Moderation"><span class="icon"><svg viewBox="0 0 40 40"><path d="M20 3 34 8v10c0 9-5 15-14 19C11 33 6 27 6 18V8Z"/><path d="m13 20 5 5 10-11"/></svg></span><h2>Moderation</h2><p>Access moderator resources, submit applications, and help keep the community safe.</p><span class="enter">Enter →</span></button>
  </div>
  <div class="footer"><span>✦</span> A SAFE SPACE FOR THE UNHINGED <span>✦</span></div>
</section>
<section class="detail" id="detailView" aria-live="polite"><div class="detail-head"><h2 id="detailTitle">Community</h2><button class="back" id="backButton">← All categories</button></div><p class="detail-description" id="detailDescription">Choose a channel to get started.</p><div class="channel-list" id="channelList"></div></section>
</main><div class="toast" id="toast" role="status"></div>
<script>
const channels={
'Community':[['welcome','TEXT'],['rules','TEXT'],['announcements','TEXT'],['the-lair','TEXT'],['meeting-in-the-lair','VC']],
'Gremlin Corner':[['intros','TEXT'],['roles','TEXT'],['community-chat','TEXT'],['community-level-ups','TEXT'],['food','TEXT'],['art','TEXT'],['vents','TEXT'],['confessions','TEXT'],['community-voice-chat','VC'],['vents (voice)','VC']],
'Gaming':[['gamertag-drop','TEXT'],['game-clips','TEXT'],['FPS','VC'],['open-world','VC'],['story-mode','VC']],
'Media':[['playlist-drops','TEXT'],['media-recs','TEXT'],['sports','TEXT'],['media-gen-chat','TEXT'],['memes-reels','TEXT']],
'TikTok':[['LIVE-alerts','TEXT'],['content','TEXT'],['clips','TEXT'],['war-room','TEXT']],
'Moderation':[['mod-app','TEXT'],['mod-guide','TEXT']]};
const descriptions={'Community':'Start here for community information, announcements, and gathering spaces.','Gremlin Corner':'Meet other members, talk about life and interests, and hang out.','Gaming':'Find teammates, share clips, and jump into gaming voice chats.','Media':'Share music, recommendations, sports talk, and memes.','TikTok':'Keep up with livestreams and content, share clips, and plan posts.','Moderation':'Moderator resources and applications for helping keep the community safe.'};
const home=document.getElementById('homeView'),detail=document.getElementById('detailView'),list=document.getElementById('channelList'),title=document.getElementById('detailTitle'),desc=document.getElementById('detailDescription');
function openCategory(category){title.textContent=category;desc.textContent=descriptions[category];list.innerHTML='';(channels[category]||[]).forEach(([channel,type])=>{const row=document.createElement('div');row.className='channel'+(type==='VC'?' vc':'');const symbol=document.createElement('span');symbol.className='channel-icon';symbol.textContent=type==='VC'?'◖))':'▤';symbol.setAttribute('aria-hidden','true');const name=document.createElement('span');name.textContent=channel;const badge=document.createElement('span');badge.className='type';badge.textContent=type==='VC'?'VOICE CHAT':'TEXT';row.append(symbol,name,badge);list.appendChild(row)});home.style.display='none';detail.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.category').forEach(card=>card.addEventListener('click',()=>openCategory(card.dataset.category)));
document.getElementById('backButton').addEventListener('click',()=>{detail.classList.remove('active');home.style.display='block';window.scrollTo({top:0,behavior:'smooth'})});
const accountButton=document.getElementById('accountButton'),menu=document.getElementById('accountMenu');accountButton.addEventListener('click',()=>{const open=menu.classList.toggle('open');accountButton.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.account')){menu.classList.remove('open');accountButton.setAttribute('aria-expanded','false')}});
const toast=document.getElementById('toast');document.querySelectorAll('[data-account]').forEach(btn=>btn.addEventListener('click',()=>{toast.textContent=btn.dataset.account+' will be available after account features are connected.';toast.classList.add('show');menu.classList.remove('open');accountButton.setAttribute('aria-expanded','false');window.setTimeout(()=>toast.classList.remove('show'),2800)}));
</script>
</body></html>
